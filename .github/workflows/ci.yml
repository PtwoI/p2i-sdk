name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: PtwoI/p2i-core
          path: deps/core
      - name: Use matching dependency branch when available (core)
        env:
          P2I_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git -C deps/core fetch origin "$P2I_BRANCH"; then
            git -C deps/core checkout --detach FETCH_HEAD
          fi
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ./deps/core -e . pytest build
      - run: python -m pytest -q tests
      - run: python -m build
