[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2i-sdk"
version = "0.4.0"
description = "Typed local API client for the P2I model explorer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["p2i-core>=0.4,<0.5"]

[project.urls]
Repository = "https://github.com/PtwoI/p2i-sdk"

[tool.setuptools.packages.find]
where = ["src"]
